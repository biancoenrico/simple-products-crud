<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSP — prova API prodotti</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
</head>
<body class="container py-3">

<p id="token-warning" class="alert alert-danger" hidden>
    Token non disponibile: il file <code>config.js</code> non è stato generato all'avvio del container.
    Controlla i log del container; senza token la pagina non chiama l'API.
</p>

<div id="message" class="alert" role="alert" hidden></div>

<section id="product-editor" class="card mb-4" hidden>
    <div class="card-body">
        <h2 id="form-title" class="h5">Nuovo prodotto</h2>
        <form id="product-form" class="row g-2 align-items-start" novalidate>
            <div class="col-md-3">
                <label class="form-label" for="product-name">Nome</label>
                <input id="product-name" class="form-control form-control-sm">
                <div class="invalid-feedback" data-error-for="name"></div>
            </div>
            <div class="col-md-5">
                <label class="form-label" for="product-description">Descrizione</label>
                <input id="product-description" class="form-control form-control-sm">
                <div class="invalid-feedback" data-error-for="description"></div>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="product-status">Stato</label>
                <select id="product-status" class="form-select form-select-sm">
                    <option value="active">Attivo</option>
                    <option value="inactive">Inattivo</option>
                </select>
                <div class="invalid-feedback" data-error-for="status"></div>
            </div>
            <div class="col-md-2 d-flex gap-2 align-self-end">
                <button id="save-product" class="btn btn-sm btn-success" type="submit">Crea</button>
                <button id="cancel-edit" class="btn btn-sm btn-outline-secondary" type="button" hidden>Annulla</button>
            </div>
        </form>
        <form id="detail-form" class="d-flex align-items-center gap-2 mt-3">
            <label class="text-nowrap" for="detail-id">Dettaglio per ID</label>
            <input id="detail-id" class="form-control form-control-sm font-monospace">
            <button class="btn btn-sm btn-primary" type="submit">Apri</button>
        </form>
    </div>
</section>

<section id="product-detail" class="card mb-4" hidden>
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <h2 class="h5">Dettaglio prodotto</h2>
            <button id="close-detail" class="btn-close" type="button" aria-label="Chiudi"></button>
        </div>
        <dl id="detail-fields" class="row mb-0 small"></dl>
    </div>
</section>

<section id="products" hidden>
    <h2 class="h5">Prodotti</h2>
    <div class="d-flex flex-wrap align-items-center gap-2 my-2">
        <label class="d-flex align-items-center gap-2">Per pagina
            <input id="per-page" class="form-control form-control-sm w-auto" type="number" value="15">
        </label>
        <button id="previous-page" class="btn btn-sm btn-primary" type="button" disabled>&laquo; Precedente</button>
        <span id="page-info"></span>
        <button id="next-page" class="btn btn-sm btn-primary" type="button" disabled>Successiva &raquo;</button>
    </div>
    <table class="table table-sm table-striped small">
        <thead class="table-primary">
            <tr><th>Nome</th><th>Descrizione</th><th>Stato</th><th>Creato il</th><th>Aggiornato il</th><th></th></tr>
        </thead>
        <tbody id="product-rows"></tbody>
    </table>
</section>


<script src="config.js"></script>
<script>
    const API_BASE = '/api/v1/products';
    const state = { page: 1, previousPage: null, nextPage: null, editingId: null };

    const $ = (id) => document.getElementById(id);

    const productUrl = (id) => `${API_BASE}/${encodeURIComponent(id)}`;

    const STATUS_LABELS = { active: 'Attivo', inactive: 'Inattivo' };

    /**
     * Chiama l'API col token della demo. Un errore di validazione finisce sotto i campi del form,
     * ogni altro errore nell'avviso in cima col messaggio dell'API.
     */
    async function callApi(method, url, body) {
        let response;
        try {
            response = await fetch(url, {
                method,
                headers: {
                    Accept: 'application/json',
                    Authorization: `Bearer ${window.DEMO_TOKEN}`,
                    ...(body ? { 'Content-Type': 'application/json' } : {}),
                },
                body: body ? JSON.stringify(body) : undefined,
            });
        } catch (error) {
            showMessage(`Server non raggiungibile: ${error.message}`, false);
            return { ok: false, json: null };
        }
        const text = await response.text();
        let json = null;
        try { json = JSON.parse(text); } catch { /* corpo vuoto o non JSON: si mostra il testo */ }

        if (!response.ok) {
            showError(response, json, text);
        }

        return { ok: response.ok, json };
    }

    function showMessage(text, ok) {
        $('message').hidden = false;
        $('message').textContent = text;
        $('message').classList.toggle('alert-success', ok);
        $('message').classList.toggle('alert-danger', !ok);
    }

    function clearFeedback() {
        $('message').hidden = true;
        document.querySelectorAll('.is-invalid').forEach((field) => field.classList.remove('is-invalid'));
    }

    function showError(response, json, text) {
        const otherErrors = [];
        for (const [field, messages] of Object.entries(json?.errors ?? {})) {
            const feedback = document.querySelector(`[data-error-for="${field}"]`);
            if (feedback) {
                feedback.textContent = messages.join(' ');
                feedback.previousElementSibling.classList.add('is-invalid');
            } else {
                otherErrors.push(...messages);
            }
        }
        if (!json?.errors || otherErrors.length > 0) {
            const detail = otherErrors.length > 0 ? otherErrors.join(' ') : (json?.message ?? text);
            showMessage(`Errore ${response.status}: ${detail}`, false);
        }
    }

    const dateFormat = new Intl.DateTimeFormat('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const formatDate = (value) => (value ? dateFormat.format(new Date(value)) : '');

    // I link del paginatore non riportano per-page: se ne prende solo il numero di pagina
    const pageOf = (link) => (link ? Number(new URL(link).searchParams.get('page')) : null);

    async function loadProducts() {
        const url = `${API_BASE}?page=${state.page}&per-page=${$('per-page').value}`;
        const { ok, json } = await callApi('GET', url);
        if (!ok) {
            $('product-rows').replaceChildren();
            $('previous-page').disabled = true;
            $('next-page').disabled = true;
            $('page-info').textContent = '';
            return;
        }

        // Cancellato l'ultimo prodotto dell'ultima pagina, quella pagina non esiste più
        if (json.data.length === 0 && json.meta.current_page > json.meta.last_page) {
            state.page = json.meta.last_page;
            return loadProducts();
        }

        $('product-rows').replaceChildren(...json.data.map((product) => {
            const row = document.createElement('tr');
            for (const field of ['name', 'description', 'status', 'created_at', 'updated_at']) {
                const cell = document.createElement('td');
                if (field === 'status') {
                    const badge = document.createElement('span');
                    badge.className = `badge ${product.status === 'active' ? 'text-bg-success' : 'text-bg-secondary'}`;
                    badge.textContent = STATUS_LABELS[product.status] ?? product.status;
                    cell.append(badge);
                } else if (field.endsWith('_at')) {
                    cell.textContent = formatDate(product[field]);
                } else {
                    cell.textContent = product[field] ?? '';
                }
                row.append(cell);
            }
            row.append(actionsCell(product));
            return row;
        }));
        if (json.data.length === 0) {
            $('product-rows').innerHTML = '<tr><td colspan="6">Nessun prodotto.</td></tr>';
        }

        state.previousPage = pageOf(json.links.prev);
        state.nextPage = pageOf(json.links.next);
        $('previous-page').disabled = state.previousPage === null;
        $('next-page').disabled = state.nextPage === null;
        $('page-info').textContent = `Pagina ${json.meta.current_page} di ${json.meta.last_page} — ${json.meta.total} prodotti`;
    }

    function actionButton(label, icon, style, onClick) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `btn btn-sm ${style}`;
        button.title = label;
        button.setAttribute('aria-label', label);
        button.innerHTML = `<i class="bi ${icon}"></i>`;
        button.addEventListener('click', onClick);
        return button;
    }

    function actionsCell(product) {
        const cell = document.createElement('td');
        cell.className = 'text-nowrap';
        cell.append(
            actionButton('Dettaglio', 'bi-eye', 'btn-outline-primary', () => { $('detail-id').value = product.id; showProduct(product.id); }),
            ' ',
            actionButton('Modifica', 'bi-pencil', 'btn-outline-warning', () => startEditing(product)),
            ' ',
            actionButton('Elimina', 'bi-trash', 'btn-outline-danger', () => deleteProduct(product)),
        );
        return cell;
    }

    async function showProduct(id) {
        clearFeedback();
        $('product-detail').hidden = true;
        const { ok, json } = await callApi('GET', productUrl(id));
        if (!ok) {
            return;
        }
        const product = json.data;
        const fields = [
            ['ID', product.id],
            ['Nome', product.name],
            ['Descrizione', product.description ?? ''],
            ['Stato', STATUS_LABELS[product.status] ?? product.status],
            ['Creato il', formatDate(product.created_at)],
            ['Aggiornato il', formatDate(product.updated_at)],
        ];
        $('detail-fields').replaceChildren(...fields.flatMap(([label, value]) => {
            const term = document.createElement('dt');
            term.className = 'col-sm-2';
            term.textContent = label;
            const description = document.createElement('dd');
            description.className = 'col-sm-10';
            description.textContent = value || '—';
            return [term, description];
        }));
        $('product-detail').hidden = false;
    }

    function startEditing(product) {
        clearFeedback();
        state.editingId = product.id;
        $('product-name').value = product.name;
        $('product-description').value = product.description ?? '';
        $('product-status').value = product.status;
        $('form-title').textContent = `Modifica «${product.name}»`;
        $('save-product').textContent = 'Salva';
        $('cancel-edit').hidden = false;
    }

    function resetForm() {
        clearFeedback();
        state.editingId = null;
        $('product-form').reset();
        $('form-title').textContent = 'Nuovo prodotto';
        $('save-product').textContent = 'Crea';
        $('cancel-edit').hidden = true;
    }

    async function saveProduct(event) {
        event.preventDefault();
        clearFeedback();
        const created = state.editingId === null;
        const body = {
            name: $('product-name').value,
            description: $('product-description').value,
            status: $('product-status').value,
        };
        const { ok } = state.editingId
            ? await callApi('PUT', productUrl(state.editingId), body)
            : await callApi('POST', API_BASE, body);
        if (ok) {
            resetForm();
            $('product-detail').hidden = true;
            showMessage(created ? 'Prodotto creato.' : 'Prodotto aggiornato.', true);
            await loadProducts();
        }
    }

    async function deleteProduct(product) {
        if (!confirm(`Cancellare «${product.name}»?`)) {
            return;
        }
        clearFeedback();
        const { ok } = await callApi('DELETE', productUrl(product.id));
        if (ok) {
            if (state.editingId === product.id) {
                resetForm();
            }
            $('product-detail').hidden = true;
            showMessage('Prodotto eliminato.', true);
            await loadProducts();
        }
    }

    if (typeof window.DEMO_TOKEN !== 'string' || window.DEMO_TOKEN === '') {
        $('token-warning').hidden = false;
    } else {
        $('products').hidden = false;
        $('product-editor').hidden = false;
        $('product-form').addEventListener('submit', saveProduct);
        $('cancel-edit').addEventListener('click', resetForm);
        $('close-detail').addEventListener('click', () => { $('product-detail').hidden = true; });
        $('detail-form').addEventListener('submit', (event) => { event.preventDefault(); showProduct($('detail-id').value.trim()); });
        $('per-page').addEventListener('change', () => { clearFeedback(); state.page = 1; loadProducts(); });
        $('previous-page').addEventListener('click', () => { clearFeedback(); state.page = state.previousPage; loadProducts(); });
        $('next-page').addEventListener('click', () => { clearFeedback(); state.page = state.nextPage; loadProducts(); });
        loadProducts();
    }
</script>
</body>
</html>
